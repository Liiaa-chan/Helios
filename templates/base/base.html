<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}{% endblock %}</title>
        <link
            rel="preconnect"
            href="https://cdnjs.cloudflare.com"
            crossorigin
        />
        <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
        <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />
        <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

        <!-- SEO Content -->
        <meta
            name="description"
            content="I'm Dian Wicaksono - Designer and Programmer who love learning deeper in Internet of Things. Love to learn new things about programming languages, architecture, OS (Operating System), and automation."
        />
        <meta
            name="keywords"
            content="Dian Wicaksono, Dian Kartiko Wicaksono"
        />
        <meta name="author" content="Dian Wicaksono" />
        <meta name="robots" content="index, follow" />

        <meta property="og:type" content="website" />
        <meta
            property="og:title"
            content="Dian Wicaksono - IoT Full Stack Developer"
        />
        <meta
            property="og:description"
            content="I'm Dian Wicaksono - Designer and Programmer who love learning deeper in Internet of Things."
        />
        <meta property="og:url" content="https://dianwicaksono.my.id/" />
        <meta
            name="google-site-verification"
            content="_5s_7qLvWzIFaiMqNZ3ii4K7bXcNPfqLn4BXbUWfIyM"
        />

        <!-- Favicon -->
        <link
            rel="icon"
            type="image/png"
            href="{{ url_for('static', filename='icon/favicon.png') }}"
        />

        <link
            href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
            media="print"
            onload="this.media = 'all'"
        />

        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='dist/output.css') }}"
        />

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
            xintegrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
            media="print"
            onload="this.media = 'all'"
        />

        <!-- Devicon secara Asinkron -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css"
            media="print"
            onload="this.media = 'all'"
        />

        <!-- Highlight.js Theme secara Asinkron -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
            media="print"
            onload="this.media = 'all'"
        />

        <!-- Quill CSS secara Asinkron -->
        <link
            href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css"
            rel="stylesheet"
            media="print"
            onload="this.media = 'all'"
        />
    </head>
    <body class="bg-zinc-950 min-h-screen flex flex-col items-center">
        <!-- Navigasi dipindah ke sini agar bisa Full Width -->
        {% include "includes/_navbar.html" %}

        <!-- Wrapper Content (Hanya untuk konten utama) -->
        <main
            class="w-full max-w-6xl mx-auto px-4 border-x border-zinc-800 bg-zinc-900 flex-grow"
        >
            <!-- Main Content -->
            {% block content %} {% endblock %}
        </main>
        <!-- Footer -->
        {% include "includes/_footer.html" %}

        <!-- InstantClick Engine -->
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/instantclick/3.1.0/instantclick.min.js"
            data-no-instant
            defer
        ></script>
        <!-- Javascript -->
        <script
            src="{{ url_for('static', filename='js/script.js') }}"
            defer
        ></script>

        <!-- Pustaka Utama Highlight.js (Dimuat secara asinkron) -->
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"
            defer
        ></script>

        <script data-no-instant>
            InstantClick.init();
        </script>
    </body>
</html>
