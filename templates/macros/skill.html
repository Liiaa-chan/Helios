{% macro render_skill(skills_list) %}
<div class="space-y-2 flex flex-col">
    <div class="flex flex-wrap justify-start items-center gap-2">
        {% for item in skills_list %}
        <div
            class="group flex items-center justify-center space-x-2 py-2 px-3 border border-zinc-800 hover:bg-zinc-800 transition-all duration-200"
        >
            <!-- Menambahkan 'colored' pada hover agar warna asli logo muncul -->
            <i class="{{ item.icon }} text-xl text-zinc-500 colored"></i>

            <p class="text-zinc-200 text-base font-normal">{{ item.name }}</p>
        </div>
        {% endfor %}
    </div>
</div>
{% endmacro %}
